<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業級流程圖自動化管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // 請在此填入您的 Firebase 設定
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
    </script>
    <style>
        .flow-card {
            transition: all 0.2s ease;
        }
        .flow-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- 頁首與功能按鈕 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <span class="text-blue-600">📊</span> 企業級流程圖自動化管理系統
                </h1>
                <p class="text-sm text-gray-500 mt-1">支援多維度排版、即時雲端同步與 Excel 雙向匯入匯出</p>
            </div>
            <div class="flex flex-wrap gap-2 mt-4 md:mt-0">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">匯出 Excel</button>
                <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm cursor-pointer">
                    匯入 Excel <input type="file" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
                </label>
                <button onclick="syncToCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">同步至雲端</button>
            </div>
        </header>

        <!-- 分頁導覽列 (保留所有流程圖與檢視模式) -->
        <nav class="flex overflow-x-auto bg-white p-2 rounded-xl shadow-sm border border-gray-100 mb-6 gap-2">
            <button onclick="switchTab('linear')" id="btn-linear" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-blue-600 text-white">線性資料表</button>
            <button onclick="switchTab('tree')" id="btn-tree" class="tab-btn px-4 py-2 rounded-lg text-sm font
